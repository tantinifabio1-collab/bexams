<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Transactions Italy — deal map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{
  /* Flighty passport palette */
  --deep:#150642;      /* page / chrome */
  --deep-2:#1B0A55;    /* raised chrome */
  --card:#2A128A;      /* card fill */
  --card-2:#35199F;    /* hover / selected fill */
  --violet:#5B2BF5;    /* landmass, buildings */
  --violet-lo:#241068;
  --lav:#A79BE0;       /* muted label text */
  --lav-dim:#7D6FBE;
  --white:#FFFFFF;
  --amber:#F5B93C;     /* route nodes, key figures */
  --cyan:#2DD4F7;
  --magenta:#FF5FD0;
  --hair:rgba(255,255,255,.14);
  --hair-soft:rgba(255,255,255,.08);
  /* value ramp: cyan -> periwinkle -> violet -> magenta -> amber */
  --r0:#2DD4F7; --r1:#7B7BFF; --r2:#C56BFF; --r3:#FF5FD0; --r4:#FFB43D;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --panel:336px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--ui);background:var(--deep);color:var(--white);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.lab{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--lav)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--panel) 1fr;grid-template-rows:74px 1fr;height:100%;
  background:var(--deep)}
#app.collapsed{grid-template-columns:0 1fr}
header{
  grid-column:1/-1;display:flex;align-items:center;gap:20px;
  padding:0 18px;background:var(--deep);z-index:5;
  border-bottom:1px solid var(--hair-soft);
}
.brand h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand .sub{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--lav-dim);margin-top:3px}
.kpis{display:flex;gap:26px;margin-left:auto;align-items:flex-end;padding-bottom:2px}
.kpi span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--lav-dim);margin-bottom:1px}
.kpi b{display:block;font-size:24px;font-weight:700;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.kpi b i{font-style:normal;font-size:14px;font-weight:600;color:var(--lav)}
.kpi.hi b{color:var(--amber)}

/* ---------- side panel ---------- */
#panel{background:var(--deep-2);display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--hair-soft)}
#app.collapsed #panel{display:none}
.tabs{display:flex;gap:6px;padding:12px 14px 10px}
.tab{flex:1;padding:8px 0;border-radius:12px;font-size:11px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--lav-dim);border:1px solid transparent}
.tab[aria-selected="true"]{color:var(--white);background:rgba(255,255,255,.09);border-color:var(--hair)}
.pane{overflow-y:auto;flex:1;padding:4px 14px 14px}
.pane[hidden]{display:none}
.fgroup{margin-bottom:17px}
.flabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.flabel em{font-style:normal;font-family:var(--mono);color:var(--white);font-size:11px}
input[type=search],select{
  width:100%;background:rgba(255,255,255,.07);border:1px solid var(--hair-soft);border-radius:12px;
  padding:9px 12px;font-size:13px;outline:none;appearance:none;
}
select{background-image:linear-gradient(45deg,transparent 50%,var(--lav) 50%),linear-gradient(135deg,var(--lav) 50%,transparent 50%);
  background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
input[type=search]::placeholder{color:var(--lav-dim)}
input[type=search]:focus,select:focus{border-color:rgba(255,255,255,.32);background-color:rgba(255,255,255,.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--hair-soft);background:rgba(255,255,255,.06);border-radius:11px;
  padding:6px 11px;font-size:12px;font-weight:500;color:var(--lav);
}
.chip[aria-pressed="true"]{border-color:rgba(255,255,255,.35);color:var(--white);background:rgba(255,255,255,.14)}
.chip small{font-family:var(--mono);font-size:10px;opacity:.55;margin-left:3px}
.dual{position:relative;height:26px}
.dual input{position:absolute;left:0;width:100%;margin:0;pointer-events:none;background:none;-webkit-appearance:none;appearance:none;top:9px}
.dual input::-webkit-slider-thumb{pointer-events:all;-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--white);border:none;box-shadow:0 0 0 4px rgba(91,43,245,.55);cursor:grab}
.dual input::-moz-range-thumb{pointer-events:all;width:15px;height:15px;border-radius:50%;background:var(--white);
  border:none;box-shadow:0 0 0 4px rgba(91,43,245,.55);cursor:grab}
.dual .track{position:absolute;top:15px;left:0;right:0;height:3px;background:rgba(255,255,255,.13);border-radius:3px}
.dual .fill{position:absolute;top:15px;height:3px;background:var(--white);border-radius:3px}
.hint{font-size:11px;color:var(--lav-dim);line-height:1.5;margin:8px 0 0}
.hint b{color:var(--lav);font-weight:600}
.btnrow{display:flex;gap:7px;margin-top:8px}
.btn{
  border:1px solid var(--hair-soft);background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;
  font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--lav);
  flex:1;text-align:center;transition:background .15s,color .15s;
}
.btn:hover{color:var(--white);background:rgba(255,255,255,.13)}
.btn.on{color:var(--deep);background:var(--white);border-color:var(--white)}
a.btn{text-decoration:none;display:block}

/* perforation + MRZ, straight from the passport */
.perf{height:1px;margin:16px 0 12px;
  background:repeating-linear-gradient(90deg,var(--hair) 0 5px,transparent 5px 11px)}
#mrz{padding:0 14px 12px;font-family:var(--mono);font-size:9.5px;line-height:1.5;
  color:rgba(255,255,255,.24);letter-spacing:.04em;white-space:nowrap;overflow:hidden;user-select:none}

/* ---------- results list ---------- */
.row{
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 11px;
  border-radius:13px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;
}
.row:hover{background:rgba(255,255,255,.07)}
.row.sel{background:var(--card);border-color:rgba(255,255,255,.28)}
.row .n{font-size:13px;font-weight:600;line-height:1.25}
.row .m{font-family:var(--mono);font-size:12px;text-align:right;color:var(--amber)}
.row .s{font-size:11px;color:var(--lav-dim)}
.row .t{font-family:var(--mono);font-size:10px;text-align:right;color:var(--lav-dim)}
.sorter{margin-bottom:10px}

/* ---------- map ---------- */
#mapwrap{position:relative;overflow:hidden;background:var(--deep)}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(21,6,66,.78)!important;color:var(--lav-dim)}
.maplibregl-ctrl-attrib a{color:var(--lav-dim)}
.maplibregl-ctrl-group{background:rgba(27,10,85,.9)!important;border:1px solid var(--hair)!important;
  border-radius:14px!important;overflow:hidden}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--hair-soft)!important}
.maplibregl-ctrl-group button span{filter:invert(1) brightness(1.6)}
.mapctl{position:absolute;top:14px;right:14px;z-index:3;display:flex;flex-direction:column;gap:8px;width:196px}
.card{background:rgba(27,10,85,.86);border:1px solid var(--hair);border-radius:18px;backdrop-filter:blur(14px)}
.card .hd{padding:11px 13px 0}
.card .bd{padding:9px 11px 11px;display:flex;flex-wrap:wrap;gap:6px}
.card .bd .btn{flex:1 1 45%}
#collapse{position:absolute;top:14px;left:14px;z-index:3;width:auto;padding:9px 14px;
  background:rgba(27,10,85,.86);border:1px solid var(--hair);border-radius:14px;backdrop-filter:blur(14px)}

#legend{position:absolute;left:14px;bottom:28px;z-index:3;width:218px;padding-bottom:12px}
#legend .bar{height:9px;border-radius:6px;margin:9px 13px 5px;
  background:linear-gradient(90deg,var(--r0),var(--r1),var(--r2),var(--r3),var(--r4))}
#legend .sc{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--lav-dim);padding:0 13px}
#legend p{margin:9px 13px 0;font-size:10.5px;color:var(--lav-dim);line-height:1.5}

/* hover card */
#tip{
  position:absolute;left:0;top:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .1s;
  width:262px;background:rgba(31,13,97,.97);border:1px solid rgba(255,255,255,.22);border-radius:18px;
  padding:13px 14px;box-shadow:0 18px 50px rgba(0,0,0,.5);
}
#tip .tn{font-size:15px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
#tip .tm{font-size:11px;color:var(--lav);margin:3px 0 11px}
#tip .duo{display:flex;gap:16px;margin-bottom:11px}
#tip .duo div span{display:block;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--lav-dim)}
#tip .duo div b{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#tip .duo div:first-child b{color:var(--white)}
#tip .duo div:last-child b{color:var(--amber)}
#tip dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0;font-size:11.5px}
#tip dt{color:var(--lav-dim)}
#tip dd{margin:0;text-align:right;font-weight:500}

/* detail drawer */
#detail{
  position:absolute;top:0;right:0;bottom:0;width:352px;z-index:7;background:var(--deep-2);
  border-left:1px solid var(--hair-soft);transform:translateX(100%);transition:transform .24s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;
}
#detail.open{transform:none}
#detail .dh{padding:18px 18px 14px;position:relative}
#detail .dh h2{font-size:21px;font-weight:700;margin:0 34px 5px 0;line-height:1.15;letter-spacing:-.02em}
#detail .dh .loc{font-size:12px;color:var(--lav)}
#close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--hair);color:var(--lav);font-size:15px;line-height:1;display:grid;place-items:center}
#close:hover{color:var(--white);background:rgba(255,255,255,.1)}
#detail .db{overflow-y:auto;padding:0 18px 24px;flex:1}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.metrics div{background:rgba(255,255,255,.06);border:1px solid var(--hair-soft);border-radius:16px;padding:11px 13px}
.metrics span{display:block;font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--lav-dim);margin-bottom:3px}
.metrics b{font-size:21px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.metrics b i{font-style:normal;font-size:13px;font-weight:600;color:var(--lav)}
.metrics .hi b{color:var(--amber)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:12.5px;margin:0 0 16px}
dl.kv dt{color:var(--lav-dim)}
dl.kv dd{margin:0;text-align:right;font-weight:500}
.note{font-size:12px;line-height:1.55;color:#DDD6FF;background:rgba(255,255,255,.06);
  border-left:2px solid var(--amber);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:16px;white-space:pre-wrap}
.badge{display:inline-block;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 8px;border-radius:8px;border:1px solid var(--hair);color:var(--lav)}
.badge.high{color:var(--cyan);border-color:rgba(45,212,247,.45)}
.badge.medium{color:var(--amber);border-color:rgba(245,185,60,.45)}
.badge.suspect{color:var(--magenta);border-color:rgba(255,95,208,.5)}
.stars{color:var(--amber);letter-spacing:2px;font-size:12px}
.warn{margin:0 0 14px;padding:10px 12px;border:1px solid rgba(255,95,208,.4);background:rgba(255,95,208,.1);
  color:#FFC7EF;font-size:11.5px;line-height:1.5;border-radius:14px}

#toast{
  position:absolute;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:9;
  background:rgba(31,13,97,.97);border:1px solid var(--hair);border-radius:14px;
  padding:10px 16px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.45)
}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--deep);z-index:8;transition:opacity .45s}
#loading.done{opacity:0;pointer-events:none}
#loading .lg{font-size:19px;font-weight:700;text-align:center;letter-spacing:-.01em}
#loading .ls{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--lav-dim);text-align:center;margin-top:8px}

@media (max-width:900px){
  :root{--panel:288px}
  #app{grid-template-columns:0 1fr;grid-template-rows:66px 1fr}
  #panel{position:absolute;top:66px;bottom:0;left:0;width:288px;z-index:6}
  #app.collapsed #panel{display:none}
  #app:not(.collapsed) #panel{display:flex}
  .kpis .kpi:nth-child(n+3){display:none}
  .kpi b{font-size:19px}
  #detail{width:100%}
  #legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Hotel Transactions Italy</h1>
      <div class="sub" id="brandsub">537 deals</div>
    </div>
    <div class="kpis">
      <div class="kpi"><span>Deals</span><b id="k-deals">—</b></div>
      <div class="kpi hi"><span>Volume</span><b id="k-vol">—</b></div>
      <div class="kpi"><span>Keys</span><b id="k-keys">—</b></div>
      <div class="kpi"><span>Median € / key</span><b id="k-ppr">—</b></div>
      <div class="kpi"><span>Median yield</span><b id="k-yield">—</b></div>
    </div>
  </header>

  <aside id="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-pane="filters">Filters</button>
      <button class="tab" role="tab" aria-selected="false" data-pane="list">Deals <small id="listcount"></small></button>
    </div>

    <div class="pane" id="pane-filters">
      <div class="fgroup">
        <div class="flabel"><span class="lab">Search</span></div>
        <input type="search" id="q" placeholder="Hotel, town, province…" autocomplete="off">
      </div>

      <div class="fgroup">
        <div class="flabel"><span class="lab">Stars</span></div>
        <div class="chips" id="starchips"></div>
      </div>

      <div class="fgroup">
        <div class="flabel"><span class="lab">Year</span><em id="yearlab"></em></div>
        <div class="dual" id="yearslider"></div>
      </div>

      <div class="fgroup">
        <div class="flabel"><span class="lab">Price</span><em id="pricelab"></em></div>
        <div class="dual" id="priceslider"></div>
        <label class="hint"><input type="checkbox" id="keepNoPrice" checked> keep deals with undisclosed price</label>
      </div>

      <div class="fgroup">
        <div class="flabel"><span class="lab">Rooms</span><em id="roomlab"></em></div>
        <div class="dual" id="roomslider"></div>
      </div>

      <div class="fgroup">
        <div class="flabel"><span class="lab">Region</span></div>
        <select id="region"></select>
      </div>

      <div class="btnrow">
        <button class="btn" id="reset">Reset</button>
        <button class="btn" id="exportcsv">Export CSV</button>
      </div>
      <p class="hint" id="geohint"></p>
    </div>

    <div class="pane" id="pane-list" hidden>
      <div class="sorter">
        <select id="sort">
          <option value="price">Price, high → low</option>
          <option value="ppr">€/key, high → low</option>
          <option value="rooms">Rooms, high → low</option>
          <option value="year">Year, new → old</option>
          <option value="name">Name, A → Z</option>
        </select>
      </div>
      <div id="list"></div>
    </div>

    <div class="perf" style="margin:0 14px"></div>
    <div id="mrz"></div>
  </aside>

  <div id="mapwrap">
    <div id="map"></div>
    <button class="btn" id="collapse">☰ Filters</button>

    <div class="mapctl">
      <div class="card">
        <div class="hd"><span class="lab">View</span></div>
        <div class="bd">
          <button class="btn on" id="t3d">3D</button>
          <button class="btn on" id="tbld">Buildings</button>
          <button class="btn" id="tsat">Satellite</button>
          <button class="btn" id="tlbl">Labels</button>
          <button class="btn" id="tfit" style="flex:1 1 100%">Zoom to results</button>
        </div>
      </div>
      <div class="card">
        <div class="hd"><span class="lab">Colour by</span></div>
        <div class="bd">
          <button class="btn on" data-color="ppr">€/key</button>
          <button class="btn" data-color="price">Price</button>
          <button class="btn" data-color="stars">Stars</button>
          <button class="btn" data-color="year">Year</button>
        </div>
      </div>
      <div class="card">
        <div class="hd"><span class="lab">Position check</span></div>
        <div class="bd">
          <button class="btn" id="tedit" style="flex:1 1 100%">Correct pins</button>
          <button class="btn" id="expfix" style="flex:1 1 100%">Export corrections</button>
        </div>
      </div>
    </div>

    <div class="card" id="legend">
      <div class="hd"><span class="lab" id="legtitle">€ per key</span></div>
      <div class="bar"></div>
      <div class="sc"><span id="legmin"></span><span id="legmax"></span></div>
      <p>Column height = price. Circle size = rooms.</p>
    </div>

    <div id="tip"></div>
    <div id="toast"></div>

    <aside id="detail">
      <div class="dh">
        <button id="close" aria-label="Close">✕</button>
        <h2 id="d-name"></h2>
        <div class="loc" id="d-loc"></div>
      </div>
      <div class="db" id="d-body"></div>
    </aside>

    <div id="loading"><div>
      <div class="lg">Hotel Transactions Italy</div>
      <div class="ls">loading basemap</div>
    </div></div>
  </div>
</div>

,"note":"Soges Group, ospitalità alberghiera e congressuale quotata a Piazza Affari, ha perfezionato il riscatto anticipato dell'immobile denominato Hotel Borgo di Cortefreda a Barberino Tavarnelle (Firenze) e la contestuale cessione dello stesso a Palazzo Costanzi.  Insieme alla compravendita, è stato sottoscritto un contratto di locazione di lunga durata che consente a Soges di proseguire senza soluzione di continuità la gestione della struttura sotto il brand Place of Charme. Il contratto ha una durata iniziale di nove anni, rinnovabile per ulteriori nove, con rinuncia da parte del locatore alla facoltà di diniego alla scadenza del primo periodo. È previsto un canone annuo a regime pari a 370.000 euro oltre Iva, integrato da una componente variabile calcolata in percentuale sul fatturato.  L'operazione, articolata nell'esercizio del diritto di riscatto anticipato dell'immobile ai sensi del contratto di leasing sottoscritto con Intesa Sanpaolo per un valore definitivo di riscatto pari a 3,2 milioni e nella successiva cessione all'acquirente per 4,9 milioni, oltre imposte, si inserisce nel percorso strategico delineato in sede di Ipo. In occasione del closing è stato sottoscritto l'accordo di indennizzo relativo alla compravendita dell'immobile, ai sensi del quale la società ha rilasciato a favore dell'acquirente le dichiarazioni e garanzie di legge e di prassi per operazioni similari, assumendone le relative obbligazioni di indennizzo. Il perfezionamento della compravendita consente alla società di rafforzare la posizione finanziaria netta, incrementare la flessibilità patrimoniale e liberare risorse destinate a nuovi investimenti, mantenendo la piena operatività delle strutture alberghiere","doc":"https://www.monitorimmobiliare.it/monitorimmobiliare/notizia/soges-riscatta-lhotel-borgo-di-cortefreda-e-lo-cede-a-palazzo-costanzi_2025-09-17171414/","url_place":"Hotel Borgo di Cortefreda","maps":"https://www.google.com/maps/place/Hotel+Borgo+di+Cortefreda/@43.5547274 /* ---------- filter state ---------- */
const YEARS = [...new Set(HOTELS.map(h=>h.year).filter(Boolean))].sort();
const PRICE_STOPS = [0,1e6,2.5e6,5e6,1e7,2e7,4e7,8e7,3e8];
const ROOM_STOPS = [0,25,50,75,100,150,200,300,500,800];

const S = {
  q:'', starsSel:new Set(), region:'',
  y0:YEARS[0], y1:YEARS[YEARS.length-1],
  p0:0, p1:PRICE_STOPS.length-1, r0:0, r1:ROOM_STOPS.length-1,
  keepNoPrice:true, colorBy:'ppr', sort:'price', selected:null, edit:false
};
let filtered = [];
const corrections = new Map();

/* ---------- filter UI ---------- */
function counts(key, val){ return HOTELS.filter(h => h[key]===val).length; }

function chipset(el, values, set, labelFn){
  el.innerHTML = values.map(v =>
    `<button class="chip" aria-pressed="false" data-v="${String(v).replace(/"/g,'&quot;')}">${labelFn(v)}</button>`).join('');
  el.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if(!b) return;
    const v = b.dataset.v;
    if(set.has(v)) set.delete(v); else set.add(v);
    b.setAttribute('aria-pressed', set.has(v));
    apply();
  });
}
chipset($('#starchips'), [1,2,3,4,5,'n/a'], S.starsSel,
  v => v==='n/a' ? 'n/a<small>'+HOTELS.filter(h=>!h.stars).length+'</small>'
       : v+'★<small>'+counts('stars',v)+'</small>');

const REGIONS = [...new Set(HOTELS.map(h=>h.regione).filter(Boolean))].sort();
$('#region').innerHTML = '<option value="">All regions</option>' +
  REGIONS.map(r=>`<option value="${r}">${r} (${counts('regione',r)})</option>`).join('');

$('#geohint').innerHTML =
  `<b>${geo.length}</b> of ${HOTELS.length} records carry a usable map link. The remaining ${noGeo.length} stay off the map and are marked in the Deals list. Deal type, chain scale and pin quality show on hover.`;

function dual(el, min, max, get, set, label){
  el.innerHTML = `<div class="track"></div><div class="fill"></div>
    <input type="range" min="${min}" max="${max}" step="1" value="${get()[0]}">
    <input type="range" min="${min}" max="${max}" step="1" value="${get()[1]}">`;
  const [a,b] = el.querySelectorAll('input'), fill = el.querySelector('.fill');
  function sync(){
    let lo = Math.min(+a.value,+b.value), hi = Math.max(+a.value,+b.value);
    fill.style.left = ((lo-min)/(max-min)*100)+'%';
    fill.style.width = ((hi-lo)/(max-min)*100)+'%';
    set(lo,hi); label();
  }
  a.oninput = b.oninput = () => { sync(); apply(); };
  sync();
  return sync;
}
const syncYear = dual($('#yearslider'), YEARS[0], YEARS[YEARS.length-1],
  ()=>[S.y0,S.y1], (a,b)=>{S.y0=a;S.y1=b;},
  ()=> $('#yearlab').textContent = S.y0===S.y1 ? S.y0 : S.y0+'–'+S.y1);
const syncPrice = dual($('#priceslider'), 0, PRICE_STOPS.length-1,
  ()=>[S.p0,S.p1], (a,b)=>{S.p0=a;S.p1=b;},
  ()=> $('#pricelab').textContent =
    (S.p0===0 && S.p1===PRICE_STOPS.length-1) ? 'any'
    : fmtM(PRICE_STOPS[S.p0])+' – '+(S.p1===PRICE_STOPS.length-1?'max':fmtM(PRICE_STOPS[S.p1])));
const syncRoom = dual($('#roomslider'), 0, ROOM_STOPS.length-1,
  ()=>[S.r0,S.r1], (a,b)=>{S.r0=a;S.r1=b;},
  ()=> $('#roomlab').textContent =
    (S.r0===0 && S.r1===ROOM_STOPS.length-1) ? 'any'
    : ROOM_STOPS[S.r0]+' – '+(S.r1===ROOM_STOPS.length-1?'max':ROOM_STOPS[S.r1]));

$('#q').oninput = e => { S.q = e.target.value.toLowerCase().trim(); apply(); };
$('#region').onchange = e => { S.region = e.target.value; apply(); };
$('#keepNoPrice').onchange = e => { S.keepNoPrice = e.target.checked; apply(); };
$('#sort').onchange = e => { S.sort = e.target.value; renderList(); };
$('#reset').onclick = () => {
  S.q=''; $('#q').value=''; S.starsSel.clear();
  $$('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
  S.region=''; $('#region').value='';
  S.y0=YEARS[0]; S.y1=YEARS[YEARS.length-1]; S.p0=0; S.p1=PRICE_STOPS.length-1;
  S.r0=0; S.r1=ROOM_STOPS.length-1;
  $('#yearslider').querySelectorAll('input').forEach((i,k)=>i.value=k?S.y1:S.y0);
  $('#priceslider').querySelectorAll('input').forEach((i,k)=>i.value=k?S.p1:S.p0);
  $('#roomslider').querySelectorAll('input').forEach((i,k)=>i.value=k?S.r1:S.r0);
  syncYear(); syncPrice(); syncRoom(); apply();
};

/* ---------- filtering ---------- */
function match(h){
  if(S.q){
    const hay = [h.name,h.comune,h.provincia,h.regione,h.scale,h.deal,h.url_place]
      .filter(Boolean).join(' ').toLowerCase();
    if(!hay.includes(S.q)) return false;
  }
  if(S.starsSel.size){
    const key = h.stars ? String(h.stars) : 'n/a';
    if(!S.starsSel.has(key)) return false;
  }
  if(S.region && h.regione !== S.region) return false;
  if(h.year != null && (h.year < S.y0 || h.year > S.y1)) return false;
  const pLo = PRICE_STOPS[S.p0], pHi = S.p1===PRICE_STOPS.length-1 ? Infinity : PRICE_STOPS[S.p1];
  if(h.price == null){ if(!S.keepNoPrice) return false; }
  else if(h.price < pLo || h.price > pHi) return false;
  const rLo = ROOM_STOPS[S.r0], rHi = S.r1===ROOM_STOPS.length-1 ? Infinity : ROOM_STOPS[S.r1];
  if(h.rooms != null && (h.rooms < rLo || h.rooms > rHi)) return false;
  return true;
}
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y);
  const m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }

function apply(){
  filtered = HOTELS.filter(match);
  const withPrice = filtered.map(h=>h.price).filter(Boolean);
  const vol = withPrice.reduce((a,b)=>a+b,0);
  const keys = filtered.reduce((a,h)=>a+(h.rooms||0),0);
  const ppr = median(filtered.map(h=>h.ppr).filter(Boolean));
  $('#k-deals').innerHTML = grp(filtered.length);
  $('#k-vol').innerHTML = withPrice.length
    ? (vol>=1e9 ? unit((vol/1e9).toFixed(2),'bn€') : unit(grp(Math.round(vol/1e6)),'m€')) : '—';
  $('#k-keys').innerHTML = grp(keys);
  $('#k-ppr').innerHTML = ppr ? unit(grp(Math.round(ppr/1e3)),'k€') : '—';
  $('#k-yield').innerHTML = fmtP(median(filtered.map(h=>h.yield).filter(Boolean)));
  $('#listcount').textContent = '('+filtered.length+')';
  mrz(filtered.length, vol, keys, ppr);
  renderList();
  updateSource();
}

/* machine-readable zone, passport style */
function mrz(n, vol, keys, ppr){
  const pad = (s,l) => (s+'<'.repeat(l)).slice(0,l);
  const l1 = 'ITA<<HOTEL<TRANSACTIONS<<' + pad(String(n),4) + '<DEALS<' + S.y0 + '<' + S.y1;
  const l2 = 'VOL<' + pad(Math.round(vol/1e6)+'M', 6) + '<KEYS<' + pad(grp(keys).replace(/\u2009/g,''),6)
           + '<KEY<' + pad(ppr?Math.round(ppr/1e3)+'K':'NA',5) + '<'.repeat(6);
  const esc = s => s.replace(/</g,'&lt;');   /* '<' in an MRZ is a filler, not a tag */
  $('#mrz').innerHTML = esc(pad(l1,46))+'<br>'+esc(pad(l2,46));
}

/* ---------- list ---------- */
let listLimit = 120;
function renderList(){
  const arr = [...filtered].sort((a,b)=>{
    if(S.sort==='name') return a.name.localeCompare(b.name);
    const k = S.sort;
    return (b[k]??-Infinity) - (a[k]??-Infinity);
  });
  const shown = arr.slice(0, listLimit);
  $('#list').innerHTML = shown.map(h=>`
    <div class="row ${S.selected===h.id?'sel':''}" data-id="${h.id}">
      <div class="n">${h.name}</div>
      <div class="m">${fmtM(h.price)}</div>
      <div class="s">${h.comune ? h.comune+(h.sigla?', '+h.sigla:'') : (h.lat?'—':'no map link')} · ${h.stars?h.stars+'★':'n/a'}</div>
      <div class="t">${h.rooms?h.rooms+' keys':'—'} · ${h.year||''}</div>
    </div>`).join('') +
    (arr.length>listLimit ? `<button class="btn" id="more" style="margin-top:10px">Show ${Math.min(200,arr.length-listLimit)} more of ${arr.length}</button>` : '');
  const more = $('#more');
  if(more) more.onclick = () => { listLimit += 200; renderList(); };
}
$('#list').addEventListener('click', e=>{
  const r = e.target.closest('.row'); if(!r) return;
  select(+r.dataset.id, true);
});

$$('.tab').forEach(t => t.onclick = () => {
  $$('.tab').forEach(x=>x.setAttribute('aria-selected', x===t));
  $('#pane-filters').hidden = t.dataset.pane!=='filters';
  $('#pane-list').hidden = t.dataset.pane!=='list';
});
$('#collapse').onclick = () => $('#app').classList.toggle('collapsed');

/* ============================================================
   MAP
   ============================================================ */
const BASEMAPS = {positron:'https://tiles.openfreemap.org/styles/positron'};
const RASTER_FALLBACK = {
  version:8,
  sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
    tileSize:256,attribution:'© OpenStreetMap contributors'}},
  layers:[{id:'osm',type:'raster',source:'osm',paint:{'raster-saturation':-0.6,'raster-brightness-max':0.55}}]
};
const SAT_TILES = 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

/* map palette lifted from the passport screen */
const MAPC = {
  land:'#241068', water:'#120538', park:'#2C1580',
  bldg:'#5B2BF5', bldgSat:'#8A6BFF',
  road:'rgba(255,255,255,.10)', boundary:'rgba(255,255,255,.24)',
  label:'#C3B6F5', halo:'#12053A'
};

let map, vectorOK = true, sat = false, show3d = true, showBld = true, showLbl = false;
let dragMarker = null;

map = new maplibregl.Map({
  container:'map', style: BASEMAPS.positron,
  center:[12.4,42.6], zoom:5.1, pitch:42, bearing:-10, maxPitch:75,
  attributionControl:{compact:true}
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
map.addControl(new maplibregl.ScaleControl({maxWidth:90,unit:'metric'}),'bottom-right');

let styleFailed = false;
map.on('error', e => {
  const msg = String(e && e.error && e.error.message || '');
  if(!styleFailed && /style|Failed to fetch|NetworkError/i.test(msg) && !map.isStyleLoaded()){
    styleFailed = true; vectorOK = false; show3d = false; showBld = false;
    toast('Vector basemap unavailable — switched to a 2D raster map.');
    $('#t3d').classList.remove('on'); $('#tbld').classList.remove('on');
    map.setStyle(RASTER_FALLBACK);
  }
});

/* repaint the basemap into the passport palette */
function skin(){
  const st = map.getStyle();
  if(!st || !st.layers) return;
  st.layers.forEach(l => {
    const id = l.id.toLowerCase();
    try{
      if(l.type === 'background'){
        map.setPaintProperty(l.id, 'background-color', MAPC.land);
      } else if(l.type === 'fill'){
        const c = /water|ocean|sea|river|lake|bay/.test(id) ? MAPC.water
                : /building/.test(id) ? MAPC.bldg
                : /park|wood|forest|grass|golf|pitch|cemetery|sand|scrub|farmland/.test(id) ? MAPC.park
                : MAPC.land;
        map.setPaintProperty(l.id, 'fill-color', c);
        if(l.paint && 'fill-outline-color' in l.paint)
          map.setPaintProperty(l.id, 'fill-outline-color', 'rgba(0,0,0,0)');
      } else if(l.type === 'line'){
        map.setPaintProperty(l.id, 'line-color',
          /boundary|admin|border/.test(id) ? MAPC.boundary
          : /water|river|stream/.test(id) ? MAPC.water : MAPC.road);
      } else if(l.type === 'symbol'){
        map.setPaintProperty(l.id, 'text-color', MAPC.label);
        map.setPaintProperty(l.id, 'text-halo-color', MAPC.halo);
        map.setPaintProperty(l.id, 'text-halo-width', 1.3);
      }
    }catch(err){ /* layer does not take that property — fine */ }
  });
}

/* --- geometry helpers --- */
function square(lon, lat, m){
  const dLat = m/111320, dLon = m/(111320*Math.cos(lat*Math.PI/180));
  return [[[lon-dLon,lat-dLat],[lon+dLon,lat-dLat],[lon+dLon,lat+dLat],[lon-dLon,lat+dLat],[lon-dLon,lat-dLat]]];
}
function pos(h){
  const c = corrections.get(h.id);
  return c ? [c.lon, c.lat] : [h.lon, h.lat];
}
function height(h){
  if(!h.price) return 24;
  return 26 + Math.sqrt(Math.min(h.price, 3e8)/3e8) * 210;
}
function toGeoJSON(list){
  return {type:'FeatureCollection', features:list.filter(h=>h.lat!=null).map(h=>({
    type:'Feature', id:h.id,
    geometry:{type:'Point', coordinates:pos(h)},
    properties:{id:h.id, name:h.name, ppr:h.ppr??-1, price:h.price??-1,
      stars:h.stars??0, year:h.year??0, rooms:h.rooms??0, h:height(h)}
  }))};
}
function toPolys(list){
  return {type:'FeatureCollection', features:list.filter(h=>h.lat!=null).map(h=>{
    const p = pos(h);
    return {type:'Feature', id:h.id,
      geometry:{type:'Polygon', coordinates:square(p[0],p[1],7)},
      properties:{id:h.id, name:h.name, ppr:h.ppr??-1, price:h.price??-1,
        stars:h.stars??0, year:h.year??0, h:height(h)}};
  })};
}

const COLOR_DEFS = {
  ppr:   {label:'€ per key', stops:[40e3,90e3,150e3,260e3,500e3], fmt:fmtK},
  price: {label:'Price',     stops:[2e6,7e6,15e6,40e6,120e6],     fmt:fmtM},
  stars: {label:'Stars',     stops:[1,2,3,4,5],                   fmt:v=>v+'★'},
  year:  {label:'Year',      stops:[2015,2018,2020,2023,2026],    fmt:v=>String(v)}
};
function colorExpr(){
  const d = COLOR_DEFS[S.colorBy];
  const inner = ['interpolate',['linear'],['get',S.colorBy]];
  d.stops.forEach((s,i)=>inner.push(s, RAMP[i]));
  return ['case', ['<=',['get',S.colorBy],0], '#6E63A8', inner];
}
function updateLegend(){
  const d = COLOR_DEFS[S.colorBy];
  $('#legtitle').textContent = d.label;
  $('#legmin').textContent = d.fmt(d.stops[0]);
  $('#legmax').textContent = d.fmt(d.stops[4])+'+';
}

/* --- layers --- */
function addLayers(){
  skin();
  if(!map.getSource('hotels')){
    map.addSource('hotels', {type:'geojson', data:toGeoJSON(filtered)});
    map.addSource('hotelcols', {type:'geojson', data:toPolys(filtered)});
  }
  const style = map.getStyle();
  const firstSymbol = (style.layers||[]).find(l=>l.type==='symbol');
  const beforeId = firstSymbol ? firstSymbol.id : undefined;

  if(sat && !map.getLayer('sat')){
    map.addSource('satsrc', {type:'raster', tiles:[SAT_TILES], tileSize:256, maxzoom:19,
      attribution:'Imagery © Esri, Maxar, Earthstar Geographics'});
    map.addLayer({id:'sat', type:'raster', source:'satsrc'}, beforeId);
  }

  if(vectorOK && !map.getLayer('bld3d')){
    const src = Object.entries(style.sources||{}).find(([,v])=>v.type==='vector');
    if(src){
      try{
        map.addLayer({
          id:'bld3d', type:'fill-extrusion', source:src[0], 'source-layer':'building',
          minzoom:14,
          paint:{
            'fill-extrusion-color': sat ? MAPC.bldgSat : MAPC.bldg,
            'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],
            'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],
            'fill-extrusion-opacity': sat ? 0.45 : 0.9,
            'fill-extrusion-vertical-gradient':true
          }
        }, beforeId);
      }catch(err){ console.warn('no building layer in this style', err); }
    }
  }

  if(!map.getLayer('cols')){
    map.addLayer({
      id:'glow', type:'circle', source:'hotels',
      paint:{
        'circle-radius':['interpolate',['linear'],['zoom'],5,6,12,26],
        'circle-color':colorExpr(), 'circle-opacity':0.3, 'circle-blur':1
      }
    });
    map.addLayer({
      id:'cols', type:'fill-extrusion', source:'hotelcols', minzoom:12,
      paint:{
        'fill-extrusion-color':colorExpr(),
        'fill-extrusion-height':['get','h'],
        'fill-extrusion-base':0,
        'fill-extrusion-opacity':0.95
      }
    });
    map.addLayer({
      id:'halo', type:'circle', source:'hotels',
      paint:{
        'circle-radius':['interpolate',['linear'],['zoom'],5,
          ['interpolate',['linear'],['get','rooms'],0,2.6,120,4.6,500,7.5], 12,
          ['interpolate',['linear'],['get','rooms'],0,5.5,120,10,500,18]],
        'circle-color':colorExpr(),
        'circle-opacity':0.95,
        'circle-stroke-width':1.2,
        'circle-stroke-color':'rgba(255,255,255,.55)'
      }
    });
    map.addLayer({
      id:'sel', type:'circle', source:'hotels', filter:['==',['get','id'],-1],
      paint:{'circle-radius':14,'circle-color':'rgba(245,185,60,.18)',
        'circle-stroke-width':2.5,'circle-stroke-color':'#FFFFFF'}
    });
    if(map.getStyle().glyphs) map.addLayer({
      id:'labels', type:'symbol', source:'hotels', minzoom:11,
      layout:{'text-field':['get','name'],'text-size':11,
        'text-font':['Noto Sans Regular'],
        'text-offset':[0,1.2],'text-anchor':'top','text-allow-overlap':false,
        'visibility': showLbl ? 'visible':'none'},
      paint:{'text-color':'#FFFFFF','text-halo-color':MAPC.halo,'text-halo-width':1.5}
    });
  }
  setVisibility();
  updateLegend();
}

function setVisibility(){
  const v = (id,on) => map.getLayer(id) && map.setLayoutProperty(id,'visibility', on?'visible':'none');
  v('cols', show3d);
  v('bld3d', showBld && vectorOK);
  v('labels', showLbl);
  if(map.getLayer('sat')) v('sat', sat);
}
function updateSource(){
  if(!map.getSource('hotels')) return;
  map.getSource('hotels').setData(toGeoJSON(filtered));
  map.getSource('hotelcols').setData(toPolys(filtered));
}
map.on('style.load', () => { addLayers(); updateSource(); });
map.on('load', () => {
  $('#loading').classList.add('done');
  setTimeout(()=>{ const l = $('#loading'); if(l) l.remove(); }, 500);
});

/* --- hover card: everything that is no longer a filter lives here --- */
const tip = $('#tip');
function tipHTML(h){
  return `<div class="tn">${h.name}</div>
    <div class="tm">${[h.comune, h.sigla&&'('+h.sigla+')', h.regione].filter(Boolean).join(' ')}</div>
    <div class="duo">
      <div><span>Price</span><b>${h.price?fmtM(h.price):'n.d.'}</b></div>
      <div><span>€ / key</span><b>${fmtK(h.ppr)}</b></div>
    </div>
    <dl>
      <dt>Rooms</dt><dd>${h.rooms??'—'}</dd>
      <dt>Stars</dt><dd>${h.stars?`<span class="stars">${stars(h.stars)}</span>`:'n/a'}</dd>
      <dt>Year</dt><dd>${h.year??'—'}${h.quarter?' '+h.quarter:''}</dd>
      ${h.yield?`<dt>Entry yield</dt><dd>${fmtP(h.yield)}</dd>`:''}
      ${h.rent?`<dt>Passing rent</dt><dd>${fmtM(h.rent)}</dd>`:''}
      <dt>Deal type</dt><dd>${h.deal||'—'}</dd>
      <dt>Chain scale</dt><dd>${h.scale||'—'}</dd>
      <dt>Pin quality</dt><dd>${h.geo_conf||'—'}</dd>
    </dl>`;
}
let hovered = null;
function onMove(e){
  const f = e.features && e.features[0]; if(!f) return;
  const h = HOTELS[f.properties.id];
  if(hovered !== h.id){ hovered = h.id; tip.innerHTML = tipHTML(h); }
  const r = map.getContainer().getBoundingClientRect();
  let x = e.point.x + 18, y = e.point.y + 18;
  if(x + 274 > r.width) x = e.point.x - 280;
  if(y + 250 > r.height) y = Math.max(8, e.point.y - 256);
  tip.style.transform = `translate(${x}px,${y}px)`;
  tip.style.opacity = 1;
  map.getCanvas().style.cursor = 'pointer';
}
function onLeave(){ tip.style.opacity = 0; hovered = null; map.getCanvas().style.cursor = ''; }
['halo','cols'].forEach(l=>{
  map.on('mousemove', l, onMove);
  map.on('mouseleave', l, onLeave);
  map.on('click', l, e => select(e.features[0].properties.id, false));
});

/* --- selection + detail --- */
function select(id, fly){
  const h = HOTELS[id]; if(!h) return;
  S.selected = id;
  renderList();
  if(map.getLayer('sel')) map.setFilter('sel',['==',['get','id'],id]);
  detail(h);
  if(fly && h.lat != null){
    map.easeTo({center:pos(h), zoom:Math.max(map.getZoom(),16.4), pitch:show3d?60:0, duration:900});
  }
  if(S.edit) placeDragMarker(h);
}
function detail(h){
  const p = h.lat!=null ? pos(h) : null;
  $('#d-name').innerHTML = h.name;
  $('#d-loc').innerHTML = [
    h.comune ? h.comune+(h.sigla?' ('+h.sigla+')':'') : null, h.regione
  ].filter(Boolean).join(' · ') + (h.stars?` &nbsp;<span class="stars">${stars(h.stars)}</span>`:'');
  const gmapsSearch = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(h.name+' hotel Italia');
  const pin = p ? `https://www.google.com/maps/search/?api=1&query=${p[1]},${p[0]}` : null;
  $('#d-body').innerHTML = `
    ${h.geo_conf==='suspect' ? '<p class="warn">This map link resolves outside Italy — the URL in the workbook almost certainly points at the wrong place. Fix it before using the coordinates.</p>':''}
    ${!p ? '<p class="warn">No coordinates in the workbook for this record, so it is not on the map. The map link is missing or is a short link that carries no latitude and longitude.</p>':''}
    <div class="metrics">
      <div class="hi"><span>Price</span><b>${h.price?fmtM(h.price):(h.price_note||'n.d.')}</b></div>
      <div class="hi"><span>€ per key</span><b>${fmtK(h.ppr)}</b></div>
      <div><span>Rooms</span><b>${h.rooms??'—'}</b></div>
      <div><span>Year</span><b>${h.year??'—'}${h.quarter?'<i> '+h.quarter+'</i>':''}</b></div>
      ${h.rent?`<div><span>Passing rent</span><b>${fmtM(h.rent)}</b></div>`:''}
      ${h.yield?`<div><span>Entry yield</span><b>${fmtP(h.yield)}</b></div>`:''}
    </div>
    <dl class="kv">
      <dt>Deal type</dt><dd>${h.deal||'—'}</dd>
      <dt>Chain scale</dt><dd>${h.scale||'—'}</dd>
      <dt>Stars</dt><dd>${h.stars_raw??'n/a'}</dd>
      ${h.rent_room?`<dt>Rent per key</dt><dd>${fmtK(h.rent_room)}</dd>`:''}
      ${h.ppr_src && Math.abs(h.ppr_src-(h.ppr||0))>1500?`<dt>€/key in file</dt><dd>${fmtK(h.ppr_src)}</dd>`:''}
      <dt>Province</dt><dd>${h.provincia||'—'}</dd>
      ${h.doc?`<dt>Source doc</dt><dd>${h.doc}</dd>`:''}
    </dl>
    ${h.note?`<div class="note">${h.note}</div>`:''}
    <div class="perf"></div>
    <div class="lab" style="margin-bottom:9px">Position</div>
    <dl class="kv">
      <dt>Coordinates</dt><dd>${p?`<span style="font-family:var(--mono);font-size:11.5px">${p[1].toFixed(5)}, ${p[0].toFixed(5)}</span>`:'—'}</dd>
      <dt>Confidence</dt><dd>${h.geo_conf?`<span class="badge ${h.geo_conf}">${h.geo_conf}</span>`:'—'}</dd>
      <dt>Read from</dt><dd>${h.geo_src||'—'}</dd>
      ${h.url_place?`<dt>Pin recorded as</dt><dd>${h.url_place}</dd>`:''}
      ${corrections.has(h.id)?`<dt>Status</dt><dd style="color:var(--amber)">moved by you</dd>`:''}
    </dl>
    <div class="btnrow">
      ${h.maps?`<a class="btn" href="${h.maps}" target="_blank" rel="noopener">Original link</a>`:''}
      ${pin?`<a class="btn" href="${pin}" target="_blank" rel="noopener">Open pin</a>`:`<a class="btn" href="${gmapsSearch}" target="_blank" rel="noopener">Search by name</a>`}
    </div>
    ${p?`<div class="btnrow"><button class="btn" id="copycoord">Copy coords</button><button class="btn" id="fixhere">Move pin</button></div>`:''}
  `;
  $('#detail').classList.add('open');
  const cc = $('#copycoord');
  if(cc) cc.onclick = () => {
    navigator.clipboard.writeText(`${p[1].toFixed(6)}, ${p[0].toFixed(6)}`);
    toast('Coordinates copied');
  };
  const fh = $('#fixhere');
  if(fh) fh.onclick = () => { setEdit(true); placeDragMarker(h); toast('Drag the marker onto the right building, then release.'); };
}
$('#close').onclick = () => {
  $('#detail').classList.remove('open'); S.selected=null;
  if(map.getLayer('sel')) map.setFilter('sel',['==',['get','id'],-1]);
  renderList();
};
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') $('#close').click();
  if(e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#app').classList.remove('collapsed'); $('#q').focus(); }
});

/* --- pin correction --- */
function setEdit(on){
  S.edit = on;
  $('#tedit').classList.toggle('on', on);
  if(!on && dragMarker){ dragMarker.remove(); dragMarker = null; }
  if(on && S.selected!=null) placeDragMarker(HOTELS[S.selected]);
}
$('#tedit').onclick = () => setEdit(!S.edit);
function placeDragMarker(h){
  if(h.lat==null) return;
  if(dragMarker) dragMarker.remove();
  const el = document.createElement('div');
  el.style.cssText='width:16px;height:16px;border-radius:50%;background:#FFFFFF;'+
    'box-shadow:0 0 0 4px rgba(245,185,60,.85),0 0 22px rgba(245,185,60,.9);cursor:grab';
  dragMarker = new maplibregl.Marker({element:el, draggable:true}).setLngLat(pos(h)).addTo(map);
  dragMarker.on('dragend', () => {
    const l = dragMarker.getLngLat();
    const moved = distance([h.lon,h.lat],[l.lng,l.lat]);
    corrections.set(h.id, {lat:l.lat, lon:l.lng, moved:Math.round(moved)});
    updateSource(); detail(h);
    toast(`Pin moved ${Math.round(moved)} m — ${corrections.size} correction${corrections.size>1?'s':''} pending export.`);
  });
}
function distance(a,b){
  const dx = (a[0]-b[0])*111320*Math.cos(a[1]*Math.PI/180), dy=(a[1]-b[1])*111320;
  return Math.hypot(dx,dy);
}
$('#expfix').onclick = () => {
  if(!corrections.size) return toast('No corrections yet. Turn on "Correct pins" and drag a marker.');
  const rows = [['id','name','lat_original','lon_original','lat_corrected','lon_corrected','moved_m']];
  corrections.forEach((c,id)=>{
    const h = HOTELS[id];
    rows.push([id,h.name,h.lat,h.lon,c.lat.toFixed(6),c.lon.toFixed(6),c.moved]);
  });
  download('hotel_pin_corrections.csv', csv(rows));
};

/* --- view toggles --- */
$('#t3d').onclick = () => {
  show3d = !show3d;
  $('#t3d').classList.toggle('on', show3d);
  setVisibility();
  map.easeTo({pitch: show3d ? 55 : 0, duration:600});
};
$('#tbld').onclick = () => {
  if(!vectorOK) return toast('Buildings need the vector basemap, which did not load.');
  showBld = !showBld; $('#tbld').classList.toggle('on', showBld); setVisibility();
};
$('#tlbl').onclick = () => { showLbl = !showLbl; $('#tlbl').classList.toggle('on', showLbl); setVisibility(); };
$('#tsat').onclick = () => {
  sat = !sat; $('#tsat').classList.toggle('on', sat);
  ['sat','bld3d','glow','cols','halo','sel','labels'].forEach(id=>{ if(map.getLayer(id)) map.removeLayer(id); });
  if(map.getSource('satsrc')) map.removeSource('satsrc');
  addLayers(); updateSource();
  if(sat && map.getZoom()<13) toast('Satellite is sharpest from zoom 13 — pick a deal to fly in.');
};
$('#tfit').onclick = () => {
  const pts = filtered.filter(h=>h.lat!=null).map(pos);
  if(!pts.length) return toast('Nothing to zoom to with these filters.');
  const b = pts.reduce((bb,p)=>bb.extend(p), new maplibregl.LngLatBounds(pts[0],pts[0]));
  map.fitBounds(b, {padding:{top:80,bottom:70,left:60,right:230}, maxZoom:15, duration:800});
};
$$('[data-color]').forEach(b => b.onclick = () => {
  S.colorBy = b.dataset.color;
  $$('[data-color]').forEach(x=>x.classList.toggle('on', x===b));
  if(map.getLayer('cols')){
    map.setPaintProperty('cols','fill-extrusion-color', colorExpr());
    map.setPaintProperty('halo','circle-color', colorExpr());
    map.setPaintProperty('glow','circle-color', colorExpr());
  }
  updateLegend();
});

/* --- export + toast --- */
function csv(rows){
  return rows.map(r=>r.map(v=>{
    const s = v==null?'':String(v);
    return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$('#exportcsv').onclick = () => {
  const cols = ['name','stars','scale','year','quarter','price','rooms','ppr','rent','yield','deal',
                'comune','provincia','regione','lat','lon','geo_conf','maps'];
  const rows = [cols].concat(filtered.map(h=>cols.map(c=>{
    if(c==='lat'||c==='lon'){ const p = h.lat!=null?pos(h):null; return p ? (c==='lat'?p[1]:p[0]) : ''; }
    return h[c] ?? '';
  })));
  download('hotel_transactions_filtered.csv', csv(rows));
  toast(filtered.length+' deals exported.');
};
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'), 3600);
}

/* --- go --- */
if(window.innerWidth<900) $('#app').classList.add('collapsed');
$('#brandsub').textContent = `${HOTELS.length} deals · ${YEARS[0]}–${YEARS[YEARS.length-1]} · ${geo.length} mapped`;
apply();
</script>
</body>
